[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recoverybox-clinician-agent"
version = "0.1.0"
description = "Read-only clinician review AgentApp for de-identified rehabilitation summaries"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "flwr>=1.34.0,<1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
recoverybox-clinician-review = "recoverybox_clinician.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recoverybox_clinician"]

[tool.flwr.app]
publisher = "recoverybox"
fab-include = [
  "recoverybox_clinician/**/*.py",
  "README.md",
  "LICENSE",
]

[tool.flwr.app.config.agent]
input = "Which de-identified sessions should I review first, and what trends are visible?"
session-summaries-json = "[]"

[tool.flwr.app.components]
agentapp = "recoverybox_clinician.agent_app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
